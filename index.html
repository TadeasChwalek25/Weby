<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendyWear – E-shop s oblečením</title>
  <link rel="stylesheet" href="styly.css" />
</head>
<body>

  <header>
    <div class="logo">👕 TrendyWear</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Domů</a></li>
        <li><a href="#">Nabídka</a></li>
        <li><a href="#">O nás</a></li>
        <li><a href="#">Kontakt</a></li>
      </ul>
    </nav>
    <div class="menu-toggle" id="menu-toggle">☰</div>
  </header>

  <section class="hero">
    <h1>Stylové oblečení pro každého</h1>
    <p>Objev novou kolekci podzim/zima 2025</p>
    <a href="#" class="btn">Prohlédnout nabídku</a>
  </section>

  <section class="products">
    <h2>Naše oblíbené kousky</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/bile-tricko.jpeg" alt="Tričko">
        <h3>Bílé tričko</h3>
        <p>399 Kč</p>
        <button>Koupit</button>
      </div>
      <div class="product-card">
        <img src="images/mikina.jpg" alt="Mikina">
        <h3>Černá mikina</h3>
        <p>799 Kč</p>
        <button>Koupit</button>
      </div>
      <div class="product-card">
        <img src="images/bunda.jpg" alt="Bunda">
        <h3>Pánská bunda</h3>
        <p>1 299 Kč</p>
        <button>Koupit</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; TrendyWear</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
