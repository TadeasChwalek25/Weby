<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styly.css" type="text/css">
    <title>Moderní přihlášení</title>
</head>
<body>
    <div class="box">
        <div class="container">
            <div class="top-header">
                <header>Přihlášení</header>
            </div>

            <div class="input-field">
                <input type="text" class="input" placeholder="Uživatel" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-field">
                <input type="password" class="input" placeholder="Heslo" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-field">
                <input type="submit" class="submit" value="Přihlásit se">
            </div>

            <div class="bottom">
                <div class="left">
                    <input type="checkbox" id="check">
                    <label for="check"> Zapamatovat si mě</label>
                </div>
                <div class="right">
                    <label><a href="#">Zapomněli jste heslo?</a></label>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
