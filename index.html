<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Look&Feel – Moderní móda online</title>
  <link rel="stylesheet" href="styly.css" type="text/css" />
</head>
<body>

  <header>
    <div class="logo">👗 Look&Feel</div>
    <nav>
      <ul class="menu">
        <li><a href="#">Domů</a></li>
        <li><a href="#">Produkty</a></li>
        <li><a href="#">O nás</a></li>
        <li><a href="#">Kontakt</a></li>
      </ul>
      <div class="burger" id="burger-menu">☰</div>
    </nav>
  </header>

  <section class="hero-section">
    <div class="hero-content">
      <h1>Nejnovější trendy pro jaro 2025</h1>
      <p>Objevte náš výběr stylových kousků, které zaujmou.</p>
      <a href="#" class="button-primary">Nakupovat teď</a>
    </div>
  </section>

  <section class="products-section">
    <h2>Top produkty</h2>
    <div class="products-container">
      <article class="product-item">
        <img src="image/mikina.jpg" alt="Mikina" />
        <h3>Černá mikina</h3>
        <p>799 Kč</p>
        <button class="buy-btn">Do košíku</button>
      </article>
      <article class="product-item">
        <img src="image/bunda.jpg" alt="Bunda" />
        <h3>Černá bunda</h3>
        <p>1 099 Kč</p>
        <button class="buy-btn">Do košíku</button>
      </article>
      <article class="product-item">
        <img src="image/bile-tricko.jpeg" alt="Bílé tričko" />
        <h3>Bílé tričko</h3>
        <p>199 Kč</p>
        <button class="buy-btn">Do košíku</button>
      </article>
      <article class="product-item">
        <img src="image/kalhoty.jpg" alt="Kalhoty" />
        <h3>Černé dlouhé kalhoty</h3>
        <p>350 Kč</p>
        <button class="buy-btn">Do košíku</button>
      </article>
    
    </div>
  </section>

  <footer>
    <p>© 2025 Look&Feel</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
