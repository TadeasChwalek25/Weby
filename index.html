<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Air</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glass-card">
    <div class="search-box">
        <input type="text" id="citySearch" placeholder="Hledat město..." autocomplete="off">
    </div>

    <div id="weatherContent">
        <div class="time-label" id="localTime">Vítejte</div>
        <div class="weather-icon" id="icon">🌍</div>
        <div class="temp" id="temp">--°</div>
        <div class="city" id="cityName">Zadejte cíl</div>
        
        <div class="stats">
            <div class="stat-item">
                <span id="wind">-- km/h</span>
                <span>VÍTR</span>
            </div>
            <div class="stat-item">
                <span id="hum">-- %</span>
                <span>VLHKOST</span>
            </div>
        </div>
    </div>
    <div class="loading-bar" id="loader"></div>
</div>

    <script src="script.js"></script>
</body>
</html>
