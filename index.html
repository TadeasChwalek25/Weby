<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podpis dokumentu</title>
    <link rel="stylesheet" href="styly.css">
</head>
<body>
    <div class="container">
        <h1>📄 Podpis dokumentu</h1>

        <div class="section">
            <h2>1. Vyberte .txt soubor</h2>
            <label class="file-label">
                <span id="fileName">Žádný soubor nevybrán</span>
                <input type="file" id="fileInput" accept=".txt" hidden>
                <button type="button" onclick="document.getElementById('fileInput').click()">Vybrat soubor</button>
            </label>
        </div>

        <div class="section">
            <h2>2. Obsah dokumentu</h2>
            <textarea id="content" readonly placeholder="Obsah souboru se zobrazí zde..."></textarea>
        </div>

        <div class="section">
            <h2>3. Vyberte signatáře</h2>
            <select id="signatureSelect">
                <option value="Bc. Šimon Novák">Bc. Šimon Novák</option>
                <option value="Tomáš Jedno MBA">Tomáš Jedno MBA</option>
                <option value="Dis. Musat Isik">Dis. Musat Isik</option>
                <option value="Ing. Martin Beneš">Ing. Martin Beneš</option>
            </select>
            
            <button onclick="signDocument()" class="sign-btn">Podepsat a stáhnout</button>
        </div>

        <div id="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
