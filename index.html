<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styly.css" type="text/css">
  <title>Ukázka filtrování dat</title>

</head>
<body>
  <h1>Ukázka filtrování dat</h1>

  <nav>
    <a href="#tabulka">Tabulka</a>
    <a href="#formular">Formulář</a>
  </nav>

  <section id="tabulka">
    <h2>Tabulka</h2>
    <input type="text" id="filterInput" placeholder="Filtrovat města...">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Město</th>
          <th>Počet obyvatel</th>
        </tr>
      </thead>
      <tbody id="dataTable">
        <tr><td>1</td><td>Praha</td><td>1 385 646</td></tr>
        <tr><td>2</td><td>Brno</td><td>374 777</td></tr>
        <tr><td>3</td><td>Ostrava</td><td>273 483</td></tr>
        <tr><td>4</td><td>Plzeň</td><td>152 592</td></tr>
        <tr><td>5</td><td>Liberec</td><td>96 356</td></tr>
        <tr><td>6</td><td>Olomouc</td><td>97 215</td></tr>
      </tbody>
    </table>
  </section>

  <section id="formular">
    <h2>Formulář</h2>
    <form id="cityForm">
      <input type="text" id="selectFilter" placeholder="Filtrovat výběr města...">
      <select id="citySelect">
        <option>Praha</option>
        <option>Brno</option>
        <option>Ostrava</option>
        <option>Plzeň</option>
        <option>Liberec</option>
        <option>Olomouc</option>
      </select>
      <button type="submit">Odeslat</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
