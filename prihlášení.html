<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styly.css" type="text/css">
    <link rel="icon" type="image/png" href="obrazek/net.png">
    <title>Přihlášení</title>
</head>
<body>
    
    <header>
        <div class="overlay"></div>
        <div class="logo">
            <img src="obrazek/logo.png" alt="logo">
        </div>

    </header>

<main class="under">
    <div class="form-wrapper">
        <h2>Přihlásit se</h2>
        <form action="#">
          <div class="form-control">
            <input type="text" required>
            <label>Email nebo telefoní číslo</label>
          </div>
          <div class="form-control">
            <input type="password" required>
            <label>Heslo</label>
          </div>
          <button type="submit">Přihlásit se</button>
          <div class="form-help">
            <div class="remember-me">
              <input type="checkbox" id="remember-me">
              <label for="remember-me">Zapamatovat</label>
            </div>
            <a href="#">Zapomněli jste heslo?</a>
          </div>
        </form>
        <p>Teprve s Netflixem začínáte?<a href="#"> Zaregistrujte se.</a></p>
        <small>
            Abychom se ujistili, že nejste robot, je tahle stránka chráněna pomocí funkce Google reCAPTCHA. 
          <a href="#">Zjistit víc.</a>
        </small>
    </div>

    <p class="dotazy">Dotazy? Volejte 800 050 701</p>



</main>

<footer>
    <p>© Netflix 2025. Všechna práva vyhrazena.</p>
</footer>

</body>
</html>
